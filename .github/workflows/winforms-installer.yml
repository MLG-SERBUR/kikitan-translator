# FORK (feed-overlay): builds the native WinForms host + Inno Setup installer
# on a real Windows runner (vpk's Windows packer only runs on Windows).

name: Build WinForms Installer (fork)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed-tests:
    name: Feed pipe + renderer tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feed-overlay

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run feed tests
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
        run: dotnet run -c Release --project tests/FeedTests/FeedTests.csproj

      - name: Upload render outputs
        uses: actions/upload-artifact@v4
        with:
          name: feed-render-outputs
          path: tests/FeedTests/test-output/

  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feed-overlay

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish app (self-contained)
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
        run: |
          dotnet publish KikitanTranslator.WinForms/KikitanTranslator.WinForms.csproj -c Release -r win-x64 --self-contained true -o KikitanTranslator.WinForms/publish/app
          dotnet publish KikitanTranslator.Overlay/KikitanTranslator.Overlay.csproj -c Release -r win-x64 --self-contained true -o KikitanTranslator.WinForms/publish/app

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          $publishDir = "$PWD\KikitanTranslator.WinForms\publish\app"
          $iconFile = "$PWD\KikitanTranslator.Photino\Resources\wwwroot\kikitan_logo.ico"
          iscc "/DPublishDir=$publishDir" "/DIconFile=$iconFile" installer\kikivrctan.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KikiVRCTan-setup
          path: installer/Output/KikiVRCTan-Setup.exe
          if-no-files-found: error

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "feed-overlay-latest"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease `
              --title "KikiVRCTan (feed-overlay latest)" `
              --notes "Latest automated build of the feed-overlay branch. Download KikiVRCTan-Setup.exe directly - no zip."
          }
          gh release upload $tag installer/Output/KikiVRCTan-Setup.exe --clobber
