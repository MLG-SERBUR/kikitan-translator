# FORK (feed-overlay): builds the native WinForms host as a portable zip
# on a real Windows runner.

name: Build KikiVRCTan portable (fork)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed-tests:
    name: Feed pipe + renderer tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feed-overlay

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Run feed tests
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
        run: dotnet run -c Release --project tests/FeedTests/FeedTests.csproj

      - name: Upload render outputs
        uses: actions/upload-artifact@v4
        with:
          name: feed-render-outputs
          path: tests/FeedTests/test-output/

  build-portable:
    name: Build portable zip
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feed-overlay

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish app (self-contained)
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
        run: |
          dotnet publish KikitanTranslator.WinForms/KikitanTranslator.WinForms.csproj -c Release -r win-x64 --self-contained true -o KikitanTranslator.WinForms/publish/app
          dotnet publish KikitanTranslator.Overlay/KikitanTranslator.Overlay.csproj -c Release -r win-x64 --self-contained true -o KikitanTranslator.WinForms/publish/app

      - name: Create portable zip
        run: Compress-Archive -Path KikitanTranslator.WinForms\publish\app\* -DestinationPath KikiVRCTan-portable.zip -Force

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: KikiVRCTan-portable
          path: KikiVRCTan-portable.zip
          if-no-files-found: error

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "feed-overlay-latest"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease `
              --title "KikiVRCTan (feed-overlay latest)" `
              --notes "Latest automated build of the feed-overlay branch. Download KikiVRCTan-portable.zip, extract anywhere, run KikitanTranslator.WinForms.exe."
          }
          gh release upload $tag KikiVRCTan-portable.zip --clobber
